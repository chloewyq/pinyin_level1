<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinyin Practice Game</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
        }

       .option {
            cursor: pointer;
            background-color: #e2e8f0;
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

       .option:hover {
            background-color: #cbd5e0;
        }

        #scoreboard {
            margin-top: 20px;
        }

       .tooltip {
            visibility: hidden;
            width: 120px;
            background-color: #555;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

       .option:hover.tooltip {
            visibility: visible;
            opacity: 1;
        }

        #music-toggle {
            margin-top: 10px;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col justify-center items-center">
    <div class="bg-white p-8 rounded shadow-md w-96">
        <h1 class="text-2xl font-bold text-center mb-6">Pinyin Practice Game</h1>
        <p class="text-center mb-4">Welcome to the Pinyin Practice Game! This game is designed to help you practice
            HSK intermediate - level Chinese pinyin. Listen to the voice and select the correct pinyin. Each correct
            answer earns you a point. Let's start!</p>
        <button id="play" class="bg-blue-500 text-white p-2 w-full rounded hover:bg-blue-600 transition">Play Voice</button>
        <div id="options" class="flex flex-wrap justify-center gap-2 mb-4"></div>
        <div id="result" class="text-center mt-4"></div>
        <div id="score" class="text-center mt-2">Score: 0</div>
        <div id="scoreboard">
            <h2 class="text-xl font-bold text-center mb-2">Leaderboard</h2>
            <ol id="leaderboard-list"></ol>
        </div>
        <button id="music-toggle" class="bg-yellow-500 text-white p-2 w-full rounded hover:bg-yellow-600 transition">Toggle Music</button>
    </div>

    <!-- 正确答案音效 -->
    <audio id="correctSound" src="https://actions.google.com/sounds/v1/impacts/coin_throw.ogg" crossorigin="anonymous" preload="auto"></audio>
    <!-- 错误答案音效 -->
    <audio id="wrongSound" src="https://actions.google.com/sounds/v1/alarms/bugle_tune.ogg" crossorigin="anonymous" preload="auto"></audio>
    <!-- 主题音乐 -->
    <audio id="themeMusic" src="https://file-examples.com/storage/fea73d62c37c3dc68d96a29/2017/11/file_example_MP3_700KB.mp3" crossorigin="anonymous" preload="auto" loop></audio>

    <script>
        let questions = [];
        let currentQuestion = 0;
        let audio;
        let score = 0;
        let leaderboard = JSON.parse(localStorage.getItem('pinyinLeaderboard')) || [];
        const correctSound = document.getElementById('correctSound');
        const wrongSound = document.getElementById('wrongSound');
        const themeMusic = document.getElementById('themeMusic');
        const musicToggle = document.getElementById('music-toggle');
        const playButton = document.getElementById('play');
        const optionsDiv = document.getElementById('options');
        const MAX_RETRIES = 3; // 最大重试次数

        async function loadQuestions() {
            try {
                const response = await fetch('hsk_intermediate_pinyin.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const jsonData = await response.json();
                if (!Array.isArray(jsonData) || jsonData.length === 0) {
                    throw new Error('Invalid or empty JSON data');
                }
                questions = jsonData;
                showOptions();
            } catch (error) {
                console.error('Error loading questions:', error);
                alert(`Failed to load questions. Please check the JSON file: ${error.message}`);
            }
        }

        function showOptions() {
            if (currentQuestion < questions.length) {
                optionsDiv.innerHTML = '';
                const shuffledOptions = [...questions].sort(() => Math.random() - 0.5).slice(0, 4);
                shuffledOptions.forEach(option => {
                    if (!option.hasOwnProperty('char') ||!option.hasOwnProperty('pinyin')) {
                        console.error('Invalid question format:', option);
                        return;
                    }
                    const span = document.createElement('span');
                    span.classList.add('option');
                    span.textContent = option.pinyin;
                    const tooltip = document.createElement('span');
                    tooltip.classList.add('tooltip');
                    tooltip.textContent = 'Click to select';
                    span.appendChild(tooltip);
                    span.addEventListener('click', () => {
                        checkAnswer(option.pinyin);
                    });
                    optionsDiv.appendChild(span);
                });
            }
        }

        playButton.addEventListener('click', async () => {
            if (questions.length === 0) {
                await loadQuestions();
            }
            if (currentQuestion < questions.length) {
                let retries = 0;
                while (retries < MAX_RETRIES) {
                    try {
                        if (audio) {
                            audio.pause();
                        }
                        // 这里暂时用一个示例音频替代拼音发音，实际中可能找不到完整对应拼音音频
                        const voiceUrl = 'https://www.soundjay.com/button/beep-07.wav';
                        audio = new Audio(voiceUrl);
                        await audio.play();
                        if (themeMusic.paused) {
                            try {
                                await themeMusic.play();
                                musicToggle.textContent = 'Pause Music';
                            } catch (playError) {
                                console.error('Failed to play theme music:', playError);
                                alert('Failed to start theme music. Please interact with the page and try again.');
                            }
                        }
                        break; // 播放成功，跳出重试循环
                    } catch (error) {
                        retries++;
                        if (retries === MAX_RETRIES) {
                            console.error('Failed to play voice after multiple attempts:', error);
                            alert('Sorry, we were unable to play the voice after several attempts. Please try again later.');
                        }
                    }
                }
            }
        });

        function checkAnswer(userAnswer) {
            const correctAnswer = questions[currentQuestion].pinyin;
            const resultDiv = document.getElementById('result');
            if (userAnswer === correctAnswer) {
                resultDiv.textContent = 'Correct! Well done!';
                resultDiv.classList.remove('text-red-500');
                resultDiv.classList.add('text-green-500');
                score++;
                document.getElementById('score').textContent = `Score: ${score}`;
                try {
                    correctSound.play();
                } catch (soundError) {
                    console.error('Failed to play correct sound:', soundError);
                    alert('Failed to play correct sound. Please check your network.');
                }
            } else {
                resultDiv.textContent = `Wrong! The correct answer is ${correctAnswer}. Keep trying!`;
                resultDiv.classList.remove('text-green-500');
                resultDiv.classList.add('text-red-500');
                try {
                    wrongSound.play();
                } catch (soundError) {
                    console.error('Failed to play wrong sound:', soundError);
                    alert('Failed to play wrong sound. Please check your network.');
                }
            }
            currentQuestion++;
            if (currentQuestion < questions.length) {
                setTimeout(() => {
                    showOptions();
                    resultDiv.textContent = '';
                }, 2000);
            } else {
                resultDiv.textContent = 'Congratulations！HSK Level 1, PASS!';
                playButton.disabled = true;
                updateLeaderboard();
            }
        }

        function updateLeaderboard() {
            leaderboard.push(score);
            leaderboard.sort((a, b) => b - a);
            localStorage.setItem('pinyinLeaderboard', JSON.stringify(leaderboard));
            displayLeaderboard();
        }

        function displayLeaderboard() {
            const leaderboardList = document.getElementById('leaderboard-list');
            leaderboardList.innerHTML = '';
            leaderboard.forEach((score, index) => {
                const li = document.createElement('li');
                li.textContent = `#${index + 1}: ${score} points`;
                leaderboardList.appendChild(li);
            });
        }

        musicToggle.addEventListener('click', async () => {
            try {
                if (themeMusic.paused) {
                    await themeMusic.play();
                    musicToggle.textContent = 'Pause Music';
                } else {
                    themeMusic.pause();
                    musicToggle.textContent = 'Play Music';
                }
            } catch (error) {
                console.error('Error toggling theme music:', error);
                alert('Failed to toggle theme music. Please check your network.');
            }
        });

        correctSound.addEventListener('error', () => {
            console.error('Error loading correct sound:', correctSound.error);
            alert('Failed to load correct sound. Please check your network.');
        });
        wrongSound.addEventListener('error', () => {
            console.error('Error loading wrong sound:', wrongSound.error);
            alert('Failed to load wrong sound. Please check your network.');
        });
        themeMusic.addEventListener('error', () => {
            console.error('Error loading theme music:', themeMusic.error);
            alert('Failed to load theme music. Please check your network.');
        });

        loadQuestions();
    </script>
</body>

</html>
